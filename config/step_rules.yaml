# 阶梯依赖规则配置
#
# 规则语义：当 trigger 字段的值落入某个 range 时，自动推算 target 字段的值。
# - 用户显式输入的字段（src=[用户]）不被覆盖
# - 最多迭代 5 次防止循环依赖
# - 变化检测：如果一轮迭代没有任何字段变化则停止
#
# range 格式：
#   min: 下限（含），缺省为 0
#   max: 上限（不含），缺省为 +inf
#   value: 触发值

step_rules:
  employee_count:
    trigger: monthly_revenue
    ranges:
      - {max: 50000, value: 2, note: "月营收<5万，通常只需2人"}
      - {min: 50000, max: 100000, value: 3, note: "月营收5-10万，通常需3人"}
      - {min: 100000, max: 200000, value: 5, note: "月营收10-20万，通常需5人"}
      - {min: 200000, max: 500000, value: 8, note: "月营收20-50万，通常需8人"}
      - {min: 500000, value: 12, note: "月营收>50万，通常需12人"}

  monthly_rent:
    trigger: employee_count
    ranges:
      - {max: 3, value: 3000, note: "2-3人团队，租金约3000"}
      - {min: 3, max: 5, value: 5000, note: "3-5人团队，租金约5000"}
      - {min: 5, max: 8, value: 8000, note: "5-8人团队，租金约8000"}
      - {min: 8, max: 12, value: 12000, note: "8-12人团队，租金约12000"}
      - {min: 12, value: 20000, note: "12人以上团队，租金约20000"}
